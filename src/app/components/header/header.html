<header class="flex items-center justify-between h-16 px-8 border-b border-border-light dark:border-border-dark">
  <h2 class="text-lg font-semibold text-text-light-primary dark:text-text-dark-primary">Product Management</h2>

  <div class="flex items-center gap-4">
    <div class="relative">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-light-secondary dark:text-text-dark-secondary">search</span>
      <input class="w-64 h-10 pl-10 pr-4 rounded-DEFAULT bg-content-light dark:bg-content-dark border border-border-light dark:border-border-dark text-text-light-primary dark:text-text-dark-primary placeholder:text-text-light-secondary dark:placeholder:text-text-dark-secondary focus:outline-none focus:ring-2 focus:ring-primary"
             placeholder="Search products..." type="text">
    </div>

    <app-theme-toggle-button class="p-2 rounded-full hover:bg-primary/10"></app-theme-toggle-button>

    <button class="relative p-2 rounded-full hover:bg-primary/10">
      <span class="material-symbols-outlined text-text-light-secondary dark:text-text-dark-secondary">notifications</span>
      <span class="absolute top-1 right-1 block h-2 w-2 rounded-full bg-primary ring-2 ring-background-light dark:ring-background-dark"></span>
    </button>

    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
         style="background-image: url('https://lh3.googleusercontent.com/a/default-user');"></div>
  </div>
</header>
